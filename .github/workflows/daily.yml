name: Daily Status

on:
  schedule:
    - cron: "17 14 * * *"  # 14:17 UTC daily, away from top of hour
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Status
        run: |
          echo "Daily check: installation, integrity, last jobs, budgets."
          echo "Update status ledger. No unnecessary model calls."
          date -u
