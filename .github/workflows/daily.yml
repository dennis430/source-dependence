name: Daily Status

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run controller
        run: python scripts/daily_controller.py
      - name: Persist state as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-state
          path: state/
