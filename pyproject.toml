[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-dependence"
version = "0.1.0"
description = "Source-dependence and evidential reconciliation methodology and portable verifier"
authors = [{name = "Dennis Liu"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "click>=8.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
source-dependence = "source_dependence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
